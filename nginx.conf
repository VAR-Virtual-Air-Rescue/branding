# Der Anmeldedienst steht nicht im Traefik -- nur nginx erreicht ihn. Der Name
# ist der Dienstname aus der docker-compose.yml.
upstream anmeldung {
  server branding-auth:8080;
}

server {
  listen 80;
  server_name _;
  root /var/www/branding;
  index index.html;

  # Traefik terminiert TLS und setzt X-Forwarded-*; hier steht nur noch das,
  # was der Proxy nicht mitbringt.
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Das Buch ist eine einzige Datei mit allem darin -- knapp zwei Megabyte,
  # davon fast alles SVG-Text. Ohne gzip waere das die halbe Ladezeit.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/markdown application/javascript
             application/json image/svg+xml;

  # SVG ist der Master und wird direkt verlinkt -- ohne den Typ liefert nginx
  # es als application/octet-stream aus, und der Browser laedt es herunter,
  # statt es zu zeigen.
  types {
    image/svg+xml  svg svgz;
    image/webp     webp;
    text/markdown  md;
  }

  # --- Anmeldung -----------------------------------------------------------
  # Alles unter /api/auth/ geht an den Node-Dienst. Er setzt die Cookies und
  # spricht als einziger mit dem Hub.
  location /api/auth/ {
    proxy_pass http://anmeldung;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Weiterleitungen des Dienstes gehen an den Browser, nicht an nginx.
    proxy_redirect off;
    # Eine Anmeldung darf nirgends zwischengespeichert werden.
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  # --- Geschuetzter Bereich ------------------------------------------------
  # `auth_request` fragt bei jedem Zugriff den Anmeldedienst: 200 heisst
  # durchlassen, 401 heisst weiterleiten. Der Vorteil gegenueber einer Pruefung
  # im Seitenskript: die Datei geht gar nicht erst raus.
  #
  # Weitere Bereiche schuetzen heisst: einen weiteren `location`-Block mit
  # denselben vier Zeilen anlegen. Das Brandbook selbst bleibt bewusst offen.
  location /konto/ {
    auth_request /_pruefe;
    error_page 401 = @anmelden;

    auth_request_set $var_name $upstream_http_x_var_name;
    proxy_set_header X-VAR-Name $var_name;

    add_header Cache-Control "private, no-store" always;
    try_files $uri $uri/ /konto/index.html;
  }

  location = /_pruefe {
    internal;
    proxy_pass http://anmeldung/api/auth/pruefen;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Nicht angemeldet: zum Hub schicken und danach dorthin zurueck, wo der
  # Nutzer hinwollte.
  location @anmelden {
    return 302 /api/auth/login?ziel=$request_uri;
  }

  # --- Inhalte -------------------------------------------------------------
  location = / {
    add_header Cache-Control "public, max-age=300" always;
    try_files /index.html =404;
  }

  # Die Markenordner sollen durchsuchbar sein: wer das Buch liest, will die
  # Nachbardateien sehen, ohne jeden Namen zu erraten.
  location ~ ^/(logo|lockup|icon|profilbilder|reel|vorlagen|karte|herleitung|png)/ {
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location /website/ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri $uri/ /website/index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
