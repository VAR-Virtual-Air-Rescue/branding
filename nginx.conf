# Der Anmeldedienst steht nicht im Traefik -- nur nginx erreicht ihn. Der Name
# ist der Dienstname aus der docker-compose.yml.
upstream anmeldung {
  server branding-auth:8080;
}

server {
  listen 80;
  server_name _;
  root /var/www/branding;
  index index.html;

  # Traefik terminiert TLS und setzt X-Forwarded-*; hier steht nur noch das,
  # was der Proxy nicht mitbringt.
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- Das Tor -------------------------------------------------------------
  # Die Anmeldepflicht steht hier oben auf Server-Ebene und gilt damit fuer
  # *jede* Location, auch fuer die, die es spaeter noch geben wird. Das ist der
  # Unterschied, auf den es ankommt: schreibt man sie in einzelne
  # location-Bloecke, ist der naechste hinzugefuegte Block offen, und niemand
  # merkt es -- ein Tor, das man vergessen kann, ist keines.
  #
  # Wer hereindarf, entscheidet der Anmeldedienst: angemeldet, nicht gesperrt,
  # nicht geloescht, E-Mail bestaetigt, Berechtigung LOGIN_BRANDING.
  auth_request /_pruefe;
  error_page 401 = @anmelden;

  # Der angemeldete Name steht der Seite zur Verfuegung, falls sie ihn braucht.
  auth_request_set $var_name $upstream_http_x_var_name;

  # Hinter der Anmeldung wird nichts oeffentlich zwischengespeichert. `private`
  # allein reicht nicht: ein Proxy auf dem Weg soll diese Antworten gar nicht
  # erst aufbewahren.
  add_header Cache-Control "private, no-store" always;

  location = /_pruefe {
    internal;
    auth_request off;              # sonst prueft die Pruefung sich selbst
    proxy_pass http://anmeldung/api/auth/pruefen;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Nicht angemeldet: zum Hub schicken und danach dorthin zurueck, wo der
  # Nutzer hinwollte.
  location @anmelden {
    auth_request off;
    return 302 /api/auth/login?ziel=$request_uri;
  }

  # --- Anmeldung: die einzige Ausnahme -------------------------------------
  # Ohne `auth_request off` verlangte der Anmeldeweg eine Anmeldung, um sich
  # anmelden zu koennen -- eine Schleife, die im Browser als Dauer-Weiterleitung
  # endet.
  location /api/auth/ {
    auth_request off;
    proxy_pass http://anmeldung;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering off;
  }

  # Suchmaschinen koennen sich nicht anmelden. Ohne diese Datei bekaemen sie
  # eine Weiterleitung zum Hub und wuerden die versuchen zu deuten.
  location = /robots.txt {
    auth_request off;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /robots.txt =404;
  }

  # --- Inhalte -------------------------------------------------------------
  # Alles ab hier ist angemeldet. Die gzip- und MIME-Einstellungen bleiben, wie
  # sie waren; der Zwischenspeicher nicht -- was hinter einer Anmeldung liegt,
  # gehoert nicht in einen gemeinsamen Cache.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/markdown application/javascript
             application/json image/svg+xml;

  # SVG ist der Master und wird direkt verlinkt -- ohne den Typ liefert nginx
  # es als application/octet-stream aus, und der Browser laedt es herunter,
  # statt es zu zeigen.
  types {
    image/svg+xml  svg svgz;
    image/webp     webp;
    text/markdown  md;
  }

  location = / {
    try_files /index.html =404;
  }

  # Die Markenordner sollen durchsuchbar sein: wer das Buch liest, will die
  # Nachbardateien sehen, ohne jeden Namen zu erraten.
  location ~ ^/(logo|lockup|icon|profilbilder|reel|vorlagen|karte|herleitung|png)/ {
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
  }

  location /website/ {
    try_files $uri $uri/ /website/index.html;
  }

  location /konto/ {
    proxy_set_header X-VAR-Name $var_name;
    try_files $uri $uri/ /konto/index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
